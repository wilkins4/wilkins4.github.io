  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d6a34a" stroke-opacity=".08"/></pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="32" stdDeviation="28" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
