  <g><rect x="70" y="355" width="175" height="115" rx="12" fill="#8b7350"/><rect x="275" y="340" width="175" height="130" rx="12" fill="#9b825b"/><rect x="480" y="320" width="175" height="150" rx="12" fill="#ad9369"/></g>
  <g stroke="#4a3a27" fill="#99815c"><rect x="700" y="335" width="155" height="135" rx="10"/><path d="M710 365h135M710 395h135M710 425h135M710 455h135" stroke-width="7"/><rect x="875" y="335" width="155" height="135" rx="10"/><path d="M885 365h135M885 405h135M885 445h135M915 345v115M955 345v115M995 345v115" stroke-width="7"/></g>
