<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Workshop Test Plate digital model</title>
<desc id="desc">Technical perspective illustration of the Workshop Test Plate with raised lines, recessed grooves, pegs, holes, relief steps, and four texture fields.</desc>
<defs>
