<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Workshop Test Plate digital model</title>
<desc id="desc">Technical perspective illustration of the Workshop Test Plate with raised lines, recessed grooves, square posts and recesses, relief steps, and four texture fields.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d0b"/><stop offset="1" stop-color="#171b15"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9c8aa"/><stop offset=".55" stop-color="#a89069"/><stop offset="1" stop-color="#766343"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d6a34a" stroke-opacity=".08"/></pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="32" stdDeviation="28" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
<text x="90" y="105" fill="#d6a34a" font-family="system-ui,sans-serif" font-size="28" font-weight="800" letter-spacing="4">WILKINSON WORKSHOP</text>
<text x="90" y="155" fill="#f3eadc" font-family="system-ui,sans-serif" font-size="54" font-weight="850">TEST PLATE v0.1.0</text>
<g transform="translate(245 255) skewY(-8)" filter="url(#shadow)">
