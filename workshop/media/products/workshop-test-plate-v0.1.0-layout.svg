<g stroke="#d6a34a" stroke-width="3" fill="none"><path d="M205 990h1190M205 975v30M1395 975v30"/><path d="M150 245v700M135 245h30M135 945h30"/></g><g fill="#d6a34a" font-family="system-ui,sans-serif" font-size="24" font-weight="750"><text x="740" y="1035">60 mm</text><text x="95" y="610" transform="rotate(-90 95 610)">40 mm</text></g>
<text x="205" y="1110" fill="#b8aa95" font-family="system-ui,sans-serif" font-size="24">Record printer, resin, layer height, exposure, wash, cure, and observations in the included Print-Log.csv.</text>
