<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Workshop Test Plate feature map</title>
<desc id="desc">Top-down diagram labeling raised lines, recessed grooves, square post and recess clearances, relief steps, and texture fields on a 60 by 40 millimeter plate.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d6a34a" stroke-opacity=".08"/></pattern></defs>
<rect width="1600" height="1180" fill="#0c0f0c"/><rect width="1600" height="1180" fill="url(#grid)"/>
<text x="90" y="90" fill="#d6a34a" font-family="system-ui,sans-serif" font-size="28" font-weight="800" letter-spacing="4">FEATURE MAP</text>
<text x="90" y="145" fill="#f3eadc" font-family="system-ui,sans-serif" font-size="52" font-weight="850">WORKSHOP TEST PLATE v0.1.0</text>
<g transform="translate(205 245)"><rect width="1190" height="700" rx="30" fill="#d2c0a2" stroke="#f3eadc" stroke-width="4"/>
<g font-family="system-ui,sans-serif" fill="#251f18"><text x="65" y="65" font-size="23" font-weight="800">A. RAISED LINES</text><text x="405" y="65" font-size="23" font-weight="800">B. RECESSED GROOVES</text><text x="805" y="65" font-size="23" font-weight="800">C. POSTS / RECESSES</text></g>
<g fill="#423425"><rect x="80" y="105" width="6" height="220"/><rect x="120" y="105" width="10" height="220"/><rect x="165" y="105" width="15" height="220"/><rect x="215" y="105" width="22" height="220"/><rect x="275" y="105" width="32" height="220"/></g>
<g fill="#c3ad8a" stroke="#55422d" stroke-width="4"><rect x="420" y="105" width="6" height="220"/><rect x="460" y="105" width="10" height="220"/><rect x="505" y="105" width="15" height="220"/><rect x="555" y="105" width="22" height="220"/><rect x="615" y="105" width="32" height="220"/></g>
<g fill="#55422d"><rect x="805" y="110" width="10" height="65"/><rect x="850" y="106" width="15" height="69"/><rect x="905" y="102" width="20" height="73"/><rect x="970" y="97" width="28" height="78"/><rect x="1050" y="90" width="38" height="85"/></g><g fill="#c3ad8a" stroke="#55422d" stroke-width="4"><rect x="805" y="230" width="10" height="65"/><rect x="850" y="226" width="15" height="69"/><rect x="905" y="222" width="20" height="73"/><rect x="970" y="217" width="28" height="78"/><rect x="1050" y="210" width="38" height="85"/></g>
<g font-family="system-ui,sans-serif" fill="#251f18"><text x="65" y="405" font-size="23" font-weight="800">D. RELIEF STEPS</text><text x="520" y="405" font-size="23" font-weight="800">E. TEXTURE FIELDS</text></g>
<g><rect x="75" y="455" width="165" height="125" rx="10" fill="#a78d65"/><rect x="270" y="440" width="165" height="140" rx="10" fill="#927852"/><rect x="465" y="420" width="165" height="160" rx="10" fill="#7e6544"/></g>
<g stroke="#55422d" fill="#b49b75" stroke-width="6"><rect x="675" y="435" width="200" height="150" rx="10"/><path d="M690 465h170M690 500h170M690 535h170M690 570h170"/><rect x="900" y="435" width="200" height="150" rx="10"/><path d="M915 465h170M915 505h170M915 545h170M945 450v120M995 450v120M1045 450v120"/></g>
